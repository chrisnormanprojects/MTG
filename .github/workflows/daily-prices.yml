name: Daily MTG price data

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-prices.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - '*.html'
      - 'data/uk_offers.csv'
      - 'README.md'

concurrency:
  group: mtg-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run importer tests
        run: python -m unittest discover -s tests -v
      - name: Fetch daily public prices and merge verified UK offers
        env:
          UK_OFFERS_CSV_URL: ${{ secrets.UK_OFFERS_CSV_URL }}
        run: python scripts/update_prices.py
      - name: Commit dated price observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh MTG price observations"
            for attempt in 1 2 3; do
              git fetch origin main
              # A newer run may have updated today's meta.json.
              # On a rebase, 'theirs' is this run's newly collected data.
              git rebase -X theirs origin/main
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not push updated price snapshots after three attempts" >&2
                exit 1
              fi
            done
          fi

      # GitHub Pages is already configured to deploy the main branch.
      # Committing new data starts its native Pages build automatically.
      # Do not run deploy-pages here as it competes with that native build.
